require conf/machine/include/v821/shared.conf
require conf/machine/include/v821/flash-nor.conf
require conf/machine/include/v821/recovery.conf

require conf/system/include/c2a/machine-boot/fit-erofs.conf
require conf/machine/include/v821/fit.conf
KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPES = "Image"
C2A_APPEND:append = " console=ttyGS0,115200 init=/usr/bin/carlinkit_otalib c2a_boot=recovery"

# catplay-bench i2c-tools
MACHINE_FIRMWARE:append = " devmem2 "
C2A_FLASH_PARTITIONS = ""
C2A_BUNDLE_NAME = "v821b-rtl8733bs"
C2A_BUNDLE_EXTRA_DEPENDS:append = " sunxi-flasher:do_deploy"
C2A_BUNDLE_EXTRA_DEPENDS:append = " virtual/dtb:do_deploy"
C2A_BUNDLE_EXTRA_DEPENDS:append = " u-boot:do_deploy"
C2A_BUNDLE_EXTRA_DEPENDS:append = " virtual/opensbi:do_deploy"

C2A_BUNDLE_ARTIFACTS:append = " \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-fel.egon.bin,v821b-rtl8733bs-u-boot-fel.egon.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-proper.bin,v821b-rtl8733bs-u-boot-proper.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-spl.egon.bin,v821b-rtl8733bs-u-boot-spl.egon.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-staging.egon.bin,v821b-rtl8733bs-u-boot-staging.egon.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-staging-proper.bin,v821b-rtl8733bs-u-boot-staging-proper.bin,1 \
 ${DEPLOY_DIR_IMAGE}/tools/flash.py,tools/flash.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/recov.py,tools/recov.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/uploader.py,tools/uploader.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/cpbox_client.py,tools/cpbox_client.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/cpbox2fel.py,tools/cpbox2fel.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/wizard.py,tools/wizard.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/reboot2recovery.py,tools/reboot2recovery.py,1 \
"
