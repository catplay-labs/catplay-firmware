require conf/system/include/c2a/machine-boot/fit-include-opensbi.conf

# Keep these addresses synchronized with recov.py and the recovery U-Boot.
UBOOT_ARCH = "riscv"
UBOOT_LOADADDRESS = "0x80000000"
UBOOT_ENTRYPOINT = "0x80000000"
UBOOT_DTB_LOADADDRESS = "0x80f00000"
UBOOT_RD_LOADADDRESS = "0x82400000"
FIT_CONF_DEFAULT_DTB = "woo.dtb"
C2A_OPENSBI = "sunxi-opensbi/opensbi-v821.bin.gz"
UBOOT_MACHINE = "v821_defconfig"
