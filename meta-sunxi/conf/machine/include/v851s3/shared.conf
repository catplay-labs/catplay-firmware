require conf/machine/include/arm/armv7a/tune-cortexa7.inc
require conf/machine/include/v851s3/kernel.conf

MACHINEOVERRIDES =. "v851:v851s3-aic8800d80:v851s:allwinner:"

DISTRO = "c2a-musl"
MACHINE_FEATURES += "wifi bluetooth"
CATPLAY_DEBUG_BUILD ?= "0"
PREFERRED_PROVIDER_virtual/kernel = "linux-sunxi"
PREFERRED_PROVIDER_virtual/dtb = "v851s3-dtb"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"

MACHINE_FIRMWARE:append = " carlinkit-otalib carlinkit-init carlinkit-mini-nvram aic8800 aic8800-fw-aic8800d80"
C2A_SYSTEM_PACKAGES:remove = "wpa-supplicant"

SRC_URI:append:pn-linux-sunxi = " file://v851s_defconfig"
