# The FIT contains a raw ARM Image. V851 DRAM starts at 0x40000000, so place
# the kernel at the ARM boot protocol address while keeping it below the FIT.
UBOOT_ENTRYPOINT = "0x40008000"

# SPL FIT loading otherwise appends the FDT immediately after the uncompressed
# ARM Image, exactly at __bss_start (0x408ba0d8 for the current kernel).
# Linux clears that BSS before reading r2, so place the FDT safely in DRAM.
UBOOT_DTB_LOADADDRESS = "0x47000000"

FIT_CONF_DEFAULT_DTB = "v851s3-aic8800d80.dtb"
UBOOT_MACHINE = "v851s_defconfig"
