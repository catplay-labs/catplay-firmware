require conf/system/include/c2a/machine-boot/fit-erofs-light.conf
require conf/system/include/c2a/persist/ubifs.conf

V851_BOOTLOADER_BIN = "${DEPLOY_DIR_IMAGE}/v851s3-u-boot-spl.egon.bin"
V851_KERNEL_BIN = "${DEPLOY_DIR_IMAGE}/fitImage"
V851_ROOTFS_BIN = "${DEPLOY_DIR_IMAGE}/${C2A_INITRAMFS_IMAGE}-${MACHINE}.erofs-lz4hc"
V851_PERSIST_BIN = "${C2A_WIC_ROOTFS_PATH}"

C2A_OTA_PARTITIONS = "\
    boot0   ${V851_BOOTLOADER_BIN} 0x00100000 \
    kernel  ${V851_KERNEL_BIN}     0x00800000 \
    rootfs  ${V851_ROOTFS_BIN}     0x01000000 \
    persist ${V851_PERSIST_BIN}    0x01000000 \
"
C2A_OTA_METADATA ?= ""
