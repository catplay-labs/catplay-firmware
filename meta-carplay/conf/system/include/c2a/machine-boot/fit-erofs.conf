# Packs kernel, erofs and dtb artifacts into one fitImage.
#
# Booting such image has a cost: whole erofs needs to be read from flash _before_ kernel is started
# _and_ the whole erofs image permanently consumes memory instead of working on page-cache basis
# like with root=/dev/mtdblockX.
#
# It's very convenient as a non-prod recovery image though.
#
# The compiled DTB is expected to consume C2A_APPEND during build or if it's not possible,
# guarantee usage of kernel args `root=/dev/initrd rootfstype=erofs`.

require conf/system/include/c2a/machine-boot/erofs-base.conf

C2A_APPEND = "root=/dev/initrd rootfstype=erofs rw quiet"

# Yocto 6.0 builds FIT images in the standalone linux-yocto-fitimage recipe.
# The kernel recipe deploys zImage as the C2A-specific linux.bin payload
# consumed by that recipe.
C2A_USE_FITIMAGE = "1"
C2A_FITIMAGE_RECIPE = "linux-yocto-fitimage"

KERNEL_CLASSES = "kernel-fitimage-c2a"
KERNEL_IMAGETYPES = "zImage"
KERNEL_IMAGETYPE = "zImage"

# These variables are consumed by linux-yocto-fitimage, not virtual/kernel.
FIT_SUPPORTED_INITRAMFS_FSTYPES:append = " erofs-lz4hc erofs-lz4"
# sha256 is too slow to check on these devices.
FIT_HASH_ALG:forcevariable = "crc32"
