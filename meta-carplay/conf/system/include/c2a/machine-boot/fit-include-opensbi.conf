# Include OpenSBI as the firmware stage of the standalone kernel FIT image.
# Set the deployed filename relative to DEPLOY_DIR_IMAGE. Override the
# defaults below when needed; the entry point follows the load address.
C2A_OPENSBI ?= ""
C2A_OPENSBI_LOADADDRESS ?= "0x80fc0000"
C2A_OPENSBI_ENTRYPOINT ?= "${C2A_OPENSBI_LOADADDRESS}"
C2A_OPENSBI_DESCRIPTION ?= "OpenSBI fw_dynamic"
C2A_OPENSBI_COMPRESSION ?= "gzip"
C2A_OPENSBI_ARCH ?= "riscv"

C2A_FITIMAGE_CLASSES:append = " fit-include-opensbi"

FIT_LOADABLES:append = " opensbi"
FIT_LOADABLE_FILENAME[opensbi] = "${C2A_OPENSBI}"
FIT_LOADABLE_DESCRIPTION[opensbi] = "${C2A_OPENSBI_DESCRIPTION}"
FIT_LOADABLE_COMPRESSION[opensbi] = "${C2A_OPENSBI_COMPRESSION}"
FIT_LOADABLE_ARCH[opensbi] = "${C2A_OPENSBI_ARCH}"
FIT_LOADABLE_OS[opensbi] = "opensbi"
FIT_LOADABLE_TYPE[opensbi] = "firmware"
FIT_LOADABLE_LOADADDRESS[opensbi] = "${C2A_OPENSBI_LOADADDRESS}"
FIT_LOADABLE_ENTRYPOINT[opensbi] = "${C2A_OPENSBI_ENTRYPOINT}"
