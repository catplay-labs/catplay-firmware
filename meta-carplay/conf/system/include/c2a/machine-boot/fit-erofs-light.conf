# Similar to fit-erofs.conf, but only packs kernel and DTB artifacts into the FIT image.
# The user is expected to consume the erofs artifact seperately (for example, by using c2aflash class)
# and use C2A_APPEND or other method to append args `root=/dev/mtdblockX rootfstype=erofs`
require conf/system/include/c2a/machine-boot/fit-erofs.conf

# kernel-fit-image.bbclass emits a ramdisk section only when this is non-empty.
# Overrides erofs-base.conf
INITRAMFS_IMAGE = ""
