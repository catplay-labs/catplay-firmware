BBPATH .= ":${LAYERDIR}"
addpylib ${LAYERDIR}/lib c2a_runqueue
BB_SCHEDULERS += "c2a_runqueue.scheduler.WeightedScheduler"

# Scale the old CPU-based task limit by the normal-task weight, preserving
# roughly one normal task per CPU while admitting more lightweight setscene.
# BB_NUMBER_THREADS is the final count cap and can still be overridden.
# Weights use exact task names; normal and setscene overrides are independent.
C2A_RUNQUEUE_BUDGET ?= "${@min(len(os.sched_getaffinity(0)), 64) * int(d.getVar('C2A_RUNQUEUE_DEFAULT_WEIGHT'))}"
C2A_RUNQUEUE_DEFAULT_WEIGHT ?= "16"
C2A_RUNQUEUE_SETSCENE_WEIGHT ?= "1"
C2A_RUNQUEUE_WEIGHTS ?= ""
BB_NUMBER_THREADS ?= "${C2A_RUNQUEUE_BUDGET}"
BBFILES += "\
  ${LAYERDIR}/recipes-*/*.bb \
  ${LAYERDIR}/recipes-*/*/*.bb \
  ${LAYERDIR}/recipes-*/*.bbappend \
  ${LAYERDIR}/recipes-*/*/*.bbappend \
"
LICENSE_PATH += "${LAYERDIR}/licenses"

BBFILE_COLLECTIONS += "carplay"
BBFILE_PATTERN_carplay = "^${LAYERDIR}/"
BBFILE_PRIORITY_carplay = "6"

LAYERSERIES_COMPAT_carplay = "scarthgap wrynose"
