require conf/machine/include/clk-mini-ultra/shared.conf
require conf/machine/include/clk-mini-ultra/flash-nor.conf

require conf/system/include/c2a/machine-boot/fit-erofs-light.conf

KERNEL_IMAGETYPE = "vmlinuz.bin"
KERNEL_IMAGETYPES = "vmlinuz.bin"
UBOOT_ARCH = "mips"
UBOOT_LOADADDRESS = "0x82f00000"
UBOOT_ENTRYPOINT = "0x82f00000"

# catplay-bench
MACHINE_FIRMWARE:append = " catplay-g-iphone catplay "

C2A_APPEND = "init=/usr/bin/carlinkit_otalib norandmaps slub_max_order=0 slub_min_objects=4 mem=64M@0x0 console=ttyS2,3000000n8 root=/dev/mtdblock_bbt_ro2 rootfstype=erofs rw quiet driver_async_probe=dwc2,jz4740-mmc lpj=549888"
