require conf/machine/include/clk-mini-ultra/shared.conf
require conf/machine/include/clk-mini-ultra/flash-nor.conf
require conf/machine/include/clk-mini-ultra/recovery.conf

require conf/system/include/c2a/machine-boot/fit-erofs.conf

KERNEL_IMAGETYPE = "vmlinuz.bin"
KERNEL_IMAGETYPES = "vmlinuz.bin"
UBOOT_ARCH = "mips"
UBOOT_LOADADDRESS = "0x82f00000"
UBOOT_ENTRYPOINT = "0x82f00000"
UBOOT_RD_LOADADDRESS = "0x82000000"
#require conf/system/include/c2a/machine-boot/initramfs.conf

# catplay-bench
MACHINE_FIRMWARE:append = " i2c-tools devmem2 catplay-g-iphone"
C2A_FLASH_PARTITIONS = ""
C2A_BUNDLE_NAME = "x1600-aic8800d80"
C2A_BUNDLE_EXTRA_DEPENDS:append = " carlinkit-mini-flasher:do_deploy u-boot:do_deploy"

C2A_BUNDLE_ARTIFACTS:append = " \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-tpl.bin,${MACHINE}-u-boot-tpl.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-proper.bin,${MACHINE}-u-boot-proper.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-staging-proper.bin,${MACHINE}-u-boot-staging-proper.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-flash-tpl.bin,${MACHINE}-u-boot-flash-tpl.bin,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-flash-spl.uImage,${MACHINE}-u-boot-flash-spl.uImage,1 \
 ${DEPLOY_DIR_IMAGE}/${MACHINE}-u-boot-flash.bin,${MACHINE}-u-boot-flash.bin,1 \
 ${DEPLOY_DIR_IMAGE}/tools/recovery_fit.py,tools/recovery_fit.py,1 \
"
C2A_BUNDLE_ARTIFACTS:append = " \
 ${DEPLOY_DIR_IMAGE}/tools/errors.py,tools/errors.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/flash.py,tools/flash.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/reboot2recovery.py,tools/reboot2recovery.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/recov.py,tools/recov.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/wizard.py,tools/wizard.py,1 \
 ${DEPLOY_DIR_IMAGE}/tools/uploader.py,tools/uploader.py,1 \
"

MACHINEOVERRIDES =. "x1600-aic8800d80:"

C2A_APPEND = "init=/usr/bin/carlinkit_otalib root=/dev/initrd mem=64M@0x0 console=ttyS2,3000000n8 rootfstype=erofs rw lpj=549888 driver_async_probe=dwc2,jz4740-mmc c2a_boot=recovery"
